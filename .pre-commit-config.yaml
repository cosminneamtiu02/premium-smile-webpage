repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^Taskfile\.yml$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: biome-check
        name: Biome lint + format check
        entry: pnpm --filter @premium-smile-webpage/frontend biome check src/
        language: system
        types_or: [javascript, ts, tsx, json]
        pass_filenames: false

      - id: vitest-unit
        name: Frontend unit tests
        entry: bash -c "cd apps/frontend && pnpm vitest run --reporter=dot"
        language: system
        pass_filenames: false
        stages: [pre-push]

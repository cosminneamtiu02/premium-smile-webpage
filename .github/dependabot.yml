# Dependabot configuration for Premium Smile.
#
# Groups batch interlocking packages into a single weekly PR so they
# version-shift atomically. Bumping one TanStack / Storybook / Vitest
# package at a time produces lockfile resolutions that silently drift
# peers in the same family; a single grouped PR avoids the cascade.
#
# Auto-merge variable and lockfile-sync PAT are documented in
# docs/automerge.md and docs/new-project-setup.md.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-official-actions:
        patterns:
          - "actions/*"

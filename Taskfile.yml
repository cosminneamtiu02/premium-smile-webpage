version: "3"

vars:
  FRONTEND_DIR: apps/frontend

tasks:
  dev:
    desc: Start the frontend dev server (Vite HMR)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev

  check:
    desc: Run all checks — lint, types, unit tests, storybook build
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: storybook:build

  lint:
    desc: Biome lint
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm biome check src/

  format:
    desc: Biome format (writes changes)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm biome format --write src/

  typecheck:
    desc: TypeScript type-check
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm tsc --noEmit

  test:
    desc: Run unit tests (Vitest)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm vitest run

  test:watch:
    desc: Vitest watch mode
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm vitest

  build:
    desc: Production build
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build

  storybook:
    desc: Start Storybook dev server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm storybook

  storybook:build:
    desc: Build Storybook (CI check)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build-storybook
